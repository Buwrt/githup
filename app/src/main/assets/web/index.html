<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-density="comfortable">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<title>githup</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="vendor/hljs-github.css" id="hljs-light">
<link rel="stylesheet" href="vendor/hljs-github-dark.css" id="hljs-dark" disabled>
</head>
<body>
<div id="splash">
  <div class="splash-logo">
    <svg viewBox="0 0 16 16" width="72" height="72" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-2.92-.88-2.92-2.9 0-.83.29-1.5.78-2.03-.08-.2-.34-.99.07-2.06 0 0 .63-.2 2.06.78a7.1 7.1 0 0 1 1.87-.25c.64 0 1.28.09 1.87.25 1.43-.98 2.06-.78 2.06-.78.41 1.07.15 1.86.07 2.06.49.53.78 1.2.78 2.03 0 2.03-1.15 2.7-2.93 2.9.3.26.56.76.56 1.54 0 1.11-.01 2.01-.01 2.28 0 .21.15.46.55.38A7.99 7.99 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
  </div>
  <div class="splash-title">githup</div>
  <div class="splash-sub">GitHub 客户端</div>
</div>

<div id="app" hidden>
  <header id="appbar">
    <div class="appbar-inner">
      <button class="icon-btn" id="btn-back" aria-label="返回" hidden></button>
      <div class="appbar-title" id="appbar-title">githup</div>
      <div class="appbar-actions" id="appbar-actions"></div>
    </div>
    <div class="progress" id="progress" hidden><div class="progress-bar"></div></div>
  </header>

  <main id="view" role="main"></main>

  <button class="fab" id="fab" hidden aria-label="新建"></button>

  <nav id="tabbar" hidden>
    <button class="tab" data-tab="home"><span class="tab-ico" data-icon="home"></span><span class="tab-label">首页</span></button>
    <button class="tab" data-tab="notifications"><span class="tab-ico" data-icon="bell"></span><span class="tab-label">通知</span><i class="badge" id="tab-badge" hidden></i></button>
    <button class="tab" data-tab="explore"><span class="tab-ico" data-icon="telescope"></span><span class="tab-label">探索</span></button>
    <button class="tab" data-tab="search"><span class="tab-ico" data-icon="search"></span><span class="tab-label">搜索</span></button>
    <button class="tab" data-tab="profile"><span class="tab-ico" data-icon="person"></span><span class="tab-label">我的</span></button>
  </nav>
</div>

<div id="sheet-root"></div>
<div id="toast-root"></div>
<div id="viewer-root"></div>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/md.js"></script>
<script src="js/page-home.js"></script>
<script src="js/page-repo.js"></script>
<script src="js/page-detail.js"></script>
<script src="js/page-user.js"></script>
<script src="js/updater.js"></script>
<script src="js/app.js"></script>
</body>
</html>
