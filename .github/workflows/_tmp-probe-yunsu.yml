name: Tmp Probe Yunsu

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run probe
        run: python3 tools/_probe_yunsu_tmp.py 2>&1 | tee yunsu.txt

      - name: Commit results
        run: |
          mkdir -p ci
          cp yunsu.txt ci/yunsu-probe.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f ci/yunsu-probe.txt
          if git diff --cached --quiet; then echo "无变化"; else git commit -m "ci: 云速通道候选实测"; git push; fi
