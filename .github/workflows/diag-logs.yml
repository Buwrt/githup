name: 诊断日志包结构

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: 取一条已结束运行的日志包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/Buwrt/githup/actions/workflows/official-release.yml/runs?per_page=5" \
            | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for r in d['workflow_runs']:
              if r['status']=='completed':
                  print(r['id']); break
          ")
          echo "目标运行: $RID"

          echo '--- 第一跳：状态码与 Location ---'
          curl -s -o /dev/null -D /tmp/h1.txt -m 60 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/Buwrt/githup/actions/runs/$RID/logs"
          head -2 /tmp/h1.txt || true
          grep -i '^location:' /tmp/h1.txt | head -1 | cut -c1-140 || echo '(无 Location)'

          echo '--- 跟随跳转下载 ---'
          curl -sL -m 120 -o /tmp/logs.zip \
            -w 'HTTP:%{http_code} size:%{size_download} type:%{content_type}\n' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/Buwrt/githup/actions/runs/$RID/logs"

          echo '--- 文件类型与魔数 ---'
          file /tmp/logs.zip || true
          xxd /tmp/logs.zip | head -2 || od -c /tmp/logs.zip | head -2

          echo '--- zip 条目清单 ---'
          {
            echo "运行: $RID"
            echo "--- 第一跳 ---"
            cat /tmp/h1.txt | head -20
            echo "--- 下载结果 ---"
            file /tmp/logs.zip || true
            xxd /tmp/logs.zip | head -2 || od -c /tmp/logs.zip | head -2
            python3 - <<'PY'
          import zipfile
          try:
              z = zipfile.ZipFile('/tmp/logs.zip')
              ns = z.namelist()
              print('条目数:', len(ns))
              for n in ns:
                  i = z.getinfo(n)
                  print('  [%s] %s size=%d compress=%s' % (
                      'DIR' if i.is_dir() else 'FILE', n, i.file_size, i.compress_type))
          except Exception as e:
              print('不是 zip:', type(e).__name__, e)
              print('前 200 字节:', open('/tmp/logs.zip','rb').read()[:200])
          PY
          } 2>&1 | tee /tmp/diag-out.txt

      - name: 把诊断结果写回仓库
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request, urllib.parse
          TOKEN = os.environ["GH_TOKEN"]
          def api(method, path, data=None):
              b = json.dumps(data).encode() if data is not None else None
              r = urllib.request.Request("https://api.github.com"+path, data=b, method=method,
                  headers={"Authorization":"Bearer "+TOKEN,"Accept":"application/vnd.github+json",
                           "Content-Type":"application/json","User-Agent":"ci"})
              with urllib.request.urlopen(r, timeout=120) as z:
                  raw = z.read().decode()
              return json.loads(raw) if raw.strip() else {}
          path = "ci/diag-logs.txt"
          q = urllib.parse.quote(path)
          body = {"message":"ci: 日志包结构诊断结果","branch":"main",
                  "content": base64.b64encode(open("/tmp/diag-out.txt","rb").read()).decode()}
          try:
              cur = api("GET", f"/repos/Buwrt/githup/contents/{q}?ref=main")
              if "sha" in cur: body["sha"] = cur["sha"]
          except Exception: pass
          api("PUT", f"/repos/Buwrt/githup/contents/{q}", body)
          print("已提交", path)
          PY
