name: 诊断日志包结构

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: 取一条已结束运行的日志包
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          RID=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/Buwrt/githup/actions/workflows/official-release.yml/runs?per_page=5" \
            | python3 -c "
          import sys,json
          d=json.load(sys.stdin)
          for r in d['workflow_runs']:
              if r['status']=='completed':
                  print(r['id']); break
          ")
          echo "目标运行: $RID"

          echo '--- 第一跳：状态码与 Location ---'
          curl -s -o /dev/null -D /tmp/h1.txt -m 60 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/Buwrt/githup/actions/runs/$RID/logs"
          head -2 /tmp/h1.txt
          grep -i '^location:' /tmp/h1.txt | head -1 | cut -c1-140

          echo '--- 跟随跳转下载 ---'
          curl -sL -m 120 -o /tmp/logs.zip \
            -w 'HTTP:%{http_code} size:%{size_download} type:%{content_type}\n' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/Buwrt/githup/actions/runs/$RID/logs"

          echo '--- 文件类型与魔数 ---'
          file /tmp/logs.zip
          xxd /tmp/logs.zip | head -2

          echo '--- zip 条目清单 ---'
          python3 - <<'PY'
          import zipfile
          try:
              z = zipfile.ZipFile('/tmp/logs.zip')
              ns = z.namelist()
              print('条目数:', len(ns))
              for n in ns:
                  i = z.getinfo(n)
                  print('  [%s] %s size=%d compress=%s' % (
                      'DIR' if i.is_dir() else 'FILE', n, i.file_size, i.compress_type))
          except Exception as e:
              print('不是 zip:', type(e).__name__, e)
              print('前 200 字节:', open('/tmp/logs.zip','rb').read()[:200])
          PY
