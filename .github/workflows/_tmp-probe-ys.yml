name: Tmp Probe Yunsu2
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          echo "=== 1. README 大小（raw 对照）==="
          curl -s -o /dev/null -w "raw 直连: HTTP %{http_code} size=%{size_download} ttfb=%{time_starttransfer}s\n" \
            -H "User-Agent: githup" \
            "https://raw.githubusercontent.com/Buwrt/githup/main/README.md"

          echo "=== 2. jsdelivr 无 Range ==="
          curl -s -o /dev/null -w "jsdelivr: HTTP %{http_code} size=%{size_download} ttfb=%{time_starttransfer}s\n" \
            -H "User-Agent: githup" \
            "https://fastly.jsdelivr.net/gh/Buwrt/githup@main/README.md"

          echo "=== 3. jsdelivr 带 Range（模拟 App 测速）==="
          curl -s -o /dev/null -w "jsdelivr+R: HTTP %{http_code} size=%{size_download} ttfb=%{time_starttransfer}s\n" \
            -H "User-Agent: githup" -H "Range: bytes=0-524287" \
            "https://fastly.jsdelivr.net/gh/Buwrt/githup@main/README.md"

          echo "=== 4. jsdelivr 带 Range + Accept-Encoding gzip（HttpURLConnection 默认行为）==="
          curl -s -o /dev/null -w "jsdelivr+gz: HTTP %{http_code} size=%{size_download} ttfb=%{time_starttransfer}s\n" \
            -H "User-Agent: githup" -H "Range: bytes=0-524287" -H "Accept-Encoding: gzip" \
            "https://fastly.jsdelivr.net/gh/Buwrt/githup@main/README.md"

          echo "=== 5. 响应头（带 Range）==="
          curl -sI -H "User-Agent: githup" -H "Range: bytes=0-524287" \
            "https://fastly.jsdelivr.net/gh/Buwrt/githup@main/README.md" | head -20

          echo "=== 6. 前 200 字节（看是不是错误页）==="
          curl -s -H "User-Agent: githup" -H "Range: bytes=0-524287" \
            "https://fastly.jsdelivr.net/gh/Buwrt/githup@main/README.md" | head -c 200
          echo ""

          echo "=== 7. 换个 ref 写法：不带 @main ==="
          curl -s -o /dev/null -w "无ref: HTTP %{http_code} size=%{size_download}\n" \
            -H "User-Agent: githup" "https://fastly.jsdelivr.net/gh/Buwrt/githup/README.md"

          echo "=== 8. 对照：云析对同一个 raw ==="
          curl -s -o /dev/null -w "云析: HTTP %{http_code} size=%{size_download} ttfb=%{time_starttransfer}s\n" \
            -H "User-Agent: githup" -H "Range: bytes=0-524287" \
            "https://cdn.gh-proxy.org/https://raw.githubusercontent.com/Buwrt/githup/main/README.md"
