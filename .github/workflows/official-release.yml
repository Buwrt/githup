# 用官方密钥打包正式版 Release APK（githup 库）
#
# 与 build-release-apk.yml 的区别：那份用 CI 临时生成的自洽密钥，
# 这份用**官方密钥**（以加密 Secret 形式在构建时还原），签出来的包
# 证书指纹 = 863dd1cd…927，与 SignCheck.EXPECTED_SHA256 一致，
# 装上不会弹「不是官方版本」。
#
# 有防护链（Guard / GuardKeys / BlockedActivity），所以除了签名，
# 还必须跑 tools/gen-guard.py 按同一份官方密钥重算链常量 ——
# 否则「签名指纹 ↔ GuardKeys」对不上，第 1 环就会把包拦进 BlockedActivity。
#
# 密钥不进仓库：用完随 runner 销毁。
name: Official Release APK (githup)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: Buwrt
      REPO: githup
      BRANCH: main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore official keystore
        run: |
          set -e
          mkdir -p keystore
          echo "$KEYSTORE_B64" | base64 -d > keystore/githup-release.jks
          printf '%s' "$KEYSTORE_PASS" > keystore/pass.txt
          # 只确认文件到位与别名正确，绝不打印密钥内容
          ls -la keystore/
          keytool -list -keystore keystore/githup-release.jks \
                  -storepass "$KEYSTORE_PASS" -alias githup | head -3
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew || true

      - name: Print version (must be 1.2.15 / 1002015)
        run: |
          echo "--- version.lock ---"
          grep -E "^version=|^versionCode=" version.lock || true
          echo "--- build.gradle ---"
          grep -E "versionName|versionCode" app/build.gradle | head -4
          echo "--- app name ---"
          grep -E "app_name" app/src/main/res/values/strings.xml || true

      - name: Regenerate guard chain constants with official key
        run: |
          set -e
          python3 tools/gen-guard.py .
          echo "--- GuardKeys 片段 ---"
          grep -E "CERT_SHA256|VERSION_NAME|VERSION_CODE|APP_LABEL" \
            app/src/main/java/com/hubmobile/app/GuardKeys.java || true
          echo "--- assets.sha 条目数 ---"
          wc -l app/src/main/assets/guard/assets.sha
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}

      - name: Build Release APK
        id: b
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Report cert fingerprint
        if: steps.b.outputs.exit == '0'
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "产物: $APK ($(stat -c%s "$APK") 字节)"
          keytool -exportcert -keystore keystore/githup-release.jks \
                  -storepass "$KEYSTORE_PASS" -alias githup -rfc \
            | openssl x509 -noout -fingerprint -sha256
          echo "--- aapt 版本信息 ---"
          $ANDROID_HOME/build-tools/*/aapt dump badging "$APK" 2>/dev/null \
            | grep -E "package:|application-label" || true
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}

      - name: Commit log and APK via API
        run: |
          python3 - <<'PYEOF'
          import base64, glob, hashlib, json, os, shutil, urllib.error, urllib.parse, urllib.request

          TOKEN = os.environ["GH_TOKEN"]
          OWNER = os.environ["OWNER"]; REPO = os.environ["REPO"]; BRANCH = os.environ["BRANCH"]
          API = "https://api.github.com"

          def api_put(path, data, msg):
              body = {"message": msg, "branch": BRANCH,
                      "content": base64.b64encode(data).decode()}
              try:
                  r = urllib.request.Request(
                      f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}?ref={BRANCH}",
                      headers={"Authorization": "Bearer " + TOKEN,
                               "Accept": "application/vnd.github+json", "User-Agent": "ci"})
                  with urllib.request.urlopen(r, timeout=60) as z:
                      sha = json.loads(z.read().decode()).get("sha")
                  if sha:
                      body["sha"] = sha
              except Exception:
                  pass
              req = urllib.request.Request(
                  f"{API}/repos/{OWNER}/{REPO}/contents/{urllib.parse.quote(path)}",
                  data=json.dumps(body).encode(), method="PUT",
                  headers={"Authorization": "Bearer " + TOKEN,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json", "User-Agent": "ci"})
              try:
                  with urllib.request.urlopen(req, timeout=240) as z:
                      print("uploaded", path, len(data))
              except urllib.error.HTTPError as e:
                  print("FAILED", path, e.code, e.read().decode()[:200])

          try:
              log = open("build.log", "rb").read()
              api_put("ci/build-official.log", b"\n".join(log.split(b"\n")[-400:]),
                      "ci: 官方密钥构建日志")
          except Exception as e:
              print("log skip", e)

          apks = glob.glob("app/build/outputs/apk/release/*.apk")
          print("found:", apks)
          for p in apks:
              d = open(p, "rb").read()
              name = os.path.basename(p)
              api_put(f"apk/{name}", d, f"ci: 官方签名 APK {name}")
              api_put(f"apk/{name}.sha256",
                      (hashlib.sha256(d).hexdigest() + "\n").encode(),
                      f"ci: {name} sha256")

          shutil.rmtree("keystore", ignore_errors=True)
          PYEOF

      - name: Upload artifact
        if: steps.b.outputs.exit == '0'
        uses: actions/upload-artifact@v4
        with:
          name: githup-official-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
