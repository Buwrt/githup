# 一次性任务：给已修复的议题留一句说明并关闭。
#
# 之所以要绕这一圈：外部令牌没有议题写权限（评论 / 关闭都是 403），
# 仓库自己的 GITHUB_TOKEN 才有。跑完即可删掉本文件和 issue-comments/。
name: 关闭已修复的议题

on:
  push:
    branches: [main]

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 评论并关闭 #1 #2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO=Buwrt/githup
          for n in 1 2; do
            state=$(gh issue view "$n" --repo "$REPO" --json state --jq .state)
            if [ "$state" != "OPEN" ]; then
              echo "#$n 当前是 $state，跳过"
              continue
            fi
            gh issue comment "$n" --repo "$REPO" --body-file ".github/issue-comments/$n.md"
            gh issue close "$n" --repo "$REPO" --reason completed
            echo "#$n 已回复并关闭"
          done
