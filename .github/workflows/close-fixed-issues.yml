# 一次性任务：给已修复的议题留一句说明并关闭。
#
# 之所以要绕这一圈：外部令牌没有议题写权限（评论 / 关闭都是 403），
# 仓库自己的 GITHUB_TOKEN 才有。跑完即可删掉本文件。
name: 关闭已修复的议题

on:
  push:
    branches: [main]

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: 评论并关闭 #1 #2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          REPO=Buwrt/githup

          close_one() {
            n="$1"; body="$2"
            state=$(gh issue view "$n" --repo "$REPO" --json state --jq .state)
            if [ "$state" != "OPEN" ]; then
              echo "#$n 已经是 $state，跳过"
              return
            fi
            gh issue comment "$n" --repo "$REPO" --body "$body"
            gh issue close "$n" --repo "$REPO" --reason completed
            echo "#$n 已回复并关闭"
          }

          close_one 1 "已在 **v1.1.3** 修好，感谢反馈。

**原因**：搜索接口只请求了第 1 页（\`per_page=30\`，没传 \`page\`），界面上也没有翻页入口 —— 所以不管实际有多少结果，永远只有那一屏，看着像「加载不出来」。

**现在**：
- 结果底部有「加载更多」，点一次追加一页（每页 30 条）
- 表头会写明「共 N 条结果（已加载 M 条）」
- GitHub 搜索本身最多只给 1000 条，翻到上限时会明确提示，不再让人干等

安装包：[githup-1.1.3.apk](https://github.com/Buwrt/githup/releases/download/v1.1.3/githup-1.1.3.apk)（713,193 字节，SHA-256 \`27f9c35e79eded65b73172832e7b1fc2e47e029431c712f13dca495970bb6e5e\`）。签名和之前一样，直接覆盖安装，不用卸载。

还有问题欢迎继续提。"

          close_one 2 "已在 **v1.1.3** 修好，感谢反馈。

**原因**：路由渲染时无条件清空内容并把滚动位置归零，按返回键也照做一遍 —— 于是「翻了半天 → 点进去 → 回来从头开始」，而且还要重新请求一次搜索接口。

**现在**：
- 按路由记住滚动位置，返回时原样还原
- 搜索结果按「类型 + 关键词」缓存，返回直接把上次的结果画出来，不再重新请求接口

顺带一提，这一版还修了 issue / README 里**看不了视频和图片**的问题：视频过去被 Markdown 渲染器整段丢掉（原始 HTML 一律丢弃），现在会内嵌播放器；外链图片也不再被包成打不开的 \`target=_blank\`，一律可点开看。

安装包：[githup-1.1.3.apk](https://github.com/Buwrt/githup/releases/download/v1.1.3/githup-1.1.3.apk)（713,193 字节）。签名和之前一样，直接覆盖安装，不用卸载。

还有问题欢迎继续提。"
