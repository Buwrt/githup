# 临时脚本：更新 v1.1.1 这个 Release 的 APK 附件（版本号不变，只换包）
# 用完即删 —— 一次性任务，不需要长期留在仓库里。
name: 刷新 Release 附件

# PAT 没有 actions 权限，触发不了 workflow_dispatch，所以用推送触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 替换同名 APK 附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh release delete-asset v1.1.1 githup-V6.apk || true
          gh release upload v1.1.1 apk/githup-V6.apk
          echo "--- 附件列表 ---"
          gh release view v1.1.1 --json assets -q '.assets[] | "\(.name) \(.size)"'
