# 【临时工作流】一次性清理仓库里全部 Release。
#
# 为什么需要它：外部令牌通常只有读取/推送仓库内容的权限，
# 调 REST 的 Release 写接口（创建、删除）都会返回 403，
# 而仓库自己的 GITHUB_TOKEN 天然有 contents:write。
#
# 用完即刻删除 —— 留着的话以后每次推 tag 都会清光历史版本。
name: 清理全部 Release

on:
  push:
    tags: ['cleanup-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: 逐个删除 Release（tag 由本地另行清理，这里不动）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: Buwrt/githup
        run: |
          set -u
          echo "GH_TOKEN 长度: ${#GH_TOKEN}"
          list=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases?per_page=100")
          echo "接口返回长度: ${#list}"
          ids=$(printf '%s' "$list" | python3 -c "
          import sys, json
          try:
              d = json.load(sys.stdin)
          except Exception as e:
              print('JSON 解析失败: ' + str(e), file=sys.stderr); sys.exit(0)
          if isinstance(d, dict):
              print('接口报错: ' + str(d.get('message')), file=sys.stderr); sys.exit(0)
          for r in d:
              print(str(r['id']) + ' ' + r['tag_name'])
          ")
          echo "待删除列表:"
          printf '%s\n' "$ids"
          for line in $ids; do
            id="${line%% *}"
            tag="${line##* }"
            echo "--- 删除 $tag (id=$id) ---"
            code=$(curl -sS -o resp.txt -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/releases/$id")
            echo "HTTP 状态: $code"
            head -c 300 resp.txt; echo
          done
          echo "=== 清理后剩余 Release ==="
          curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases?per_page=100" \
            | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print('剩余数量:', len(d) if isinstance(d, list) else '查询异常')
          if isinstance(d, list):
              for r in d: print('  -', r['tag_name'])
          "
